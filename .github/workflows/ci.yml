name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Seed demo cache
        run: npm run gen:demo

      - name: Offline pipeline run (--mock --dry)
        run: npm run repurpose -- --mock --dry

      - name: Offline pipeline write + schedule
        run: npm run repurpose -- --mock --schedule --days=7

      - name: Sanity check artifacts
        run: |
          test -s data/out/omnipost.json
          test -s data/out/omnipost.md
          test -s data/out/calendar.csv
          test -s data/out/calendar.ics
          echo "ok"
